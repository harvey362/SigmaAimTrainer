<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Aim Trainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: #0a0a0a;
      color: #fff;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Loading screen */
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      z-index: 1000;
    }

    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <h1>Loading Sigma Aim Trainer...</h1>
    </div>
    <!-- Crosshair -->
    <div class="crosshair" id="crosshair"></div>
    <!-- HUD Overlay -->
    <div class="ui-overlay">
      <!-- Stats Display (Top Right) -->
      <div class="stats-display" id="stats-display">
        <div>Hits: <span id="hits">0</span></div>
        <div>Shots: <span id="shots">0</span></div>
        <div>Accuracy: <span id="accuracy">0</span>%</div>
      </div>
      <!-- Timer Display (Top Center) -->
      <div class="timer-display" id="timer-display">
        <span id="timer">--:--</span>
      </div>
      <!-- Lives Display (Top Left) -->
      <div class="lives-display" id="lives-display" style="display: none;">
        <div>Lives: <span id="lives">3</span></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
