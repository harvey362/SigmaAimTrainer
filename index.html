<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Aim Trainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: #0a0a0a;
      color: #fff;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Loading screen */
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      z-index: 1000;
    }

    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <h1>Loading Sigma Aim Trainer...</h1>
    </div>
    <!-- Crosshair -->
    <div class="crosshair" id="crosshair"></div>
    <!-- HUD Overlay -->
    <div class="ui-overlay">
      <!-- Stats Display (Top Right) -->
      <div class="stats-display" id="stats-display">
        <div>Hits: <span id="hits">0</span></div>
        <div>Shots: <span id="shots">0</span></div>
        <div>Accuracy: <span id="accuracy">0</span>%</div>
      </div>
      <!-- Timer Display (Top Center) -->
      <div class="timer-display" id="timer-display">
        <span id="timer">--:--</span>
      </div>
      <!-- Lives Display (Top Left) -->
      <div class="lives-display" id="lives-display" style="display: none;">
        <div>Lives: <span id="lives">3</span></div>
      </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-screen">
      <div class="menu-container">
        <h1 class="menu-title">SIGMA AIM TRAINER</h1>
        <div class="menu-buttons">
          <button id="btn-play" class="menu-btn">PLAY</button>
          <button id="btn-settings" class="menu-btn">SETTINGS</button>
          <button id="btn-stats" class="menu-btn">STATS</button>
        </div>
      </div>
    </div>

    <!-- Setup Menu (Session Configuration) -->
    <div id="setup-menu" class="menu-screen" style="display: none;">
      <div class="setup-container">
        <h2 class="setup-title">SESSION SETUP</h2>
        <div class="setup-content">
          <!-- Session Type -->
          <div class="setup-section">
            <h3>Session Type</h3>
            <div class="button-group">
              <button class="setup-option active" data-session="untimed">Untimed</button>
              <button class="setup-option" data-session="30s">30 Seconds</button>
              <button class="setup-option" data-session="60s">1 Minute</button>
            </div>
          </div>

          <!-- Target Settings -->
          <div class="setup-section">
            <h3>Target Movement</h3>
            <div class="button-group">
              <button class="setup-option active" data-movement="none">Stationary</button>
              <button class="setup-option" data-movement="predictable">Predictable</button>
              <button class="setup-option" data-movement="random">Random</button>
            </div>
          </div>

          <!-- Attack Speed -->
          <div class="setup-section">
            <h3>Attack Speed</h3>
            <div class="slider-group">
              <input type="range" id="attack-speed" min="0.5" max="2.0" step="0.1" value="1.0">
              <span class="slider-value" id="attack-speed-value">1.0x</span>
            </div>
          </div>

          <!-- Lives System -->
          <div class="setup-section">
            <h3>Lives System</h3>
            <div class="toggle-group">
              <label class="toggle">
                <input type="checkbox" id="lives-enabled">
                <span class="toggle-slider"></span>
              </label>
              <input type="number" id="lives-count" value="3" min="1" max="10" disabled>
            </div>
          </div>
        </div>

        <div class="setup-actions">
          <button id="btn-start-session" class="menu-btn primary">START</button>
          <button id="btn-back-main" class="menu-btn secondary">BACK</button>
        </div>
      </div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="menu-screen" style="display: none;">
      <div class="menu-container">
        <h2 class="menu-title">PAUSED</h2>
        <div class="menu-buttons">
          <button id="btn-resume" class="menu-btn">RESUME</button>
          <button id="btn-quit" class="menu-btn">QUIT TO MENU</button>
        </div>
      </div>
    </div>

    <!-- Results Menu -->
    <div id="results-menu" class="menu-screen" style="display: none;">
      <div class="results-container">
        <h2 class="results-title">SESSION COMPLETE</h2>
        <div class="results-stats">
          <div class="stat-box">
            <div class="stat-label">Accuracy</div>
            <div class="stat-value" id="result-accuracy">0%</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Hits</div>
            <div class="stat-value" id="result-hits">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Shots</div>
            <div class="stat-value" id="result-shots">0</div>
          </div>
        </div>
        <div class="menu-buttons">
          <button id="btn-restart" class="menu-btn primary">RESTART</button>
          <button id="btn-back-menu" class="menu-btn">MAIN MENU</button>
        </div>
      </div>
    </div>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
